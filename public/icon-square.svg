<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2B2B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="240" height="240" rx="42" fill="url(#badgeGrad)"/>
  <rect x="6" y="6" width="228" height="228" rx="38" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>

  <!-- Lineas finas de "libro contable" en el fondo, sutiles -->
  <g stroke="#555555" stroke-width="1.5" opacity="0.6">
    <line x1="30" y1="185" x2="210" y2="185"/>
    <line x1="30" y1="200" x2="210" y2="200"/>
  </g>

  <!-- Barras ascendentes (crecimiento / cumplimiento de pagos) -->
  <rect x="52"  y="150" width="26" height="55" rx="4" fill="#FFFFFF"/>
  <rect x="94"  y="120" width="26" height="85" rx="4" fill="#FFFFFF"/>
  <rect x="136" y="90"  width="26" height="115" rx="4" fill="#FFFFFF"/>

  <!-- Flecha ascendente que remata en check, sobre las barras -->
  <path d="M50 128 L96 92 L138 112 L192 58"
        fill="none" stroke="url(#barGrad)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M158 58 L192 58 L192 92"
        fill="none" stroke="url(#barGrad)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
